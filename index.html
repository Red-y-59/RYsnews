<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RY's 表纸</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #f6f7f9;
      color: #111827;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Navigation -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-2">
      <button id="nav-logo" type="button" class="flex items-center gap-2 text-left shrink-0">
        <span class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold text-sm">涼</span>
        <div class="leading-tight">
          <div class="font-semibold text-sm sm:text-base text-slate-900">RY's 表纸</div>
          <div class="text-[11px] text-slate-500 hidden sm:block">便利店打印整理</div>
        </div>
      </button>

      <!-- Desktop Nav Tabs -->
      <nav class="hidden md:flex items-center gap-1" id="desktop-nav">
        <button type="button" data-view="home" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-medium transition">首页</button>
        <button type="button" data-view="browse" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-medium transition">分类浏览</button>
        <button type="button" data-view="search" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-medium transition">搜索筛选</button>
        <button type="button" data-view="print" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
          <span>待打印清单</span>
          <span id="badge-print-desktop" class="px-1.5 py-0.5 text-xs rounded-full bg-rose-600 text-white font-semibold">0</span>
        </button>
      </nav>

      <div class="flex items-center gap-2 shrink-0">
        <button id="btn-open-upload" type="button" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-medium transition flex items-center gap-1">
          <span>+ 录入版面</span>
        </button>
        <button id="btn-open-backup" type="button" class="px-2.5 py-1.5 rounded-lg border border-gray-200 hover:bg-gray-50 text-slate-700 text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
          <span id="sync-dot" class="w-2 h-2 rounded-full bg-slate-300"></span>
          <span>同步与备份</span>
        </button>
      </div>
    </div>

    <!-- Mobile Nav Bar -->
    <div class="md:hidden border-t border-gray-100 bg-white px-2 py-1.5 flex items-center justify-around text-xs">
      <button type="button" data-view="home" class="nav-btn px-2.5 py-1.5 rounded-md font-medium">首页</button>
      <button type="button" data-view="browse" class="nav-btn px-2.5 py-1.5 rounded-md font-medium">分类</button>
      <button type="button" data-view="search" class="nav-btn px-2.5 py-1.5 rounded-md font-medium">搜索</button>
      <button type="button" data-view="print" class="nav-btn px-2.5 py-1.5 rounded-md font-medium flex items-center gap-1">
        <span>待打印</span>
        <span id="badge-print-mobile" class="px-1.5 py-0.2 rounded-full bg-rose-600 text-white text-[10px] font-semibold">0</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-6 py-5">

    <!-- VIEW: HOME -->
    <section id="view-home" class="space-y-6">
      <!-- Quick Search Bar -->
      <div class="bg-white rounded-2xl border border-gray-200 p-4 sm:p-5 shadow-sm">
        <form id="home-search-form" class="flex flex-col sm:flex-row gap-2.5">
          <div class="relative flex-1">
            <input id="home-search-input" type="text" placeholder="搜索活动类别、具体活动、出版社或商品番号..." class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/15 focus:border-slate-400" />
            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/></svg>
          </div>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium transition shrink-0">
            全局搜索
          </button>
        </form>
        <div class="mt-3 flex justify-end text-xs">
          <button type="button" id="btn-home-print-shortcut" class="text-rose-600 hover:text-rose-700 font-medium flex items-center gap-1">
            <span>前往待打印清单</span>
            <span>→</span>
          </button>
        </div>
      </div>

      <!-- Publishers Entry -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base sm:text-lg font-semibold text-slate-900">出版社分类入口</h2>
          <button type="button" id="btn-home-manage-cats" class="text-xs sm:text-sm text-slate-600 hover:text-slate-900 font-medium">管理分类 →</button>
        </div>
        <div id="home-publishers-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
      </div>

      <!-- Recently Added -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base sm:text-lg font-semibold text-slate-900">最近新增的版面</h2>
          <span id="home-total-count" class="text-xs text-slate-500"></span>
        </div>
        <div id="home-recent-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4"></div>
      </div>
    </section>

    <!-- VIEW: BROWSE (4-level Category + 5th-level Editions) -->
    <section id="view-browse" class="hidden space-y-4">
      <!-- Breadcrumb Bar -->
      <div class="bg-white rounded-xl border border-gray-200 px-3.5 py-2.5 flex flex-wrap items-center justify-between gap-2">
        <div id="browse-breadcrumbs" class="flex flex-wrap items-center gap-1.5 text-xs sm:text-sm"></div>
        <div class="flex items-center gap-2">
          <button type="button" id="btn-browse-back" class="px-2.5 py-1 rounded-lg border border-gray-200 hover:bg-gray-50 text-xs font-medium text-slate-700 hidden">
            ← 返回上一级
          </button>
          <button type="button" id="btn-browse-add-child" class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium">
            + 新增
          </button>
        </div>
      </div>

      <!-- Level Title & Sub-items or Photo Wall -->
      <div id="browse-header" class="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 id="browse-title" class="text-lg font-semibold text-slate-900"></h2>
          <p id="browse-subtitle" class="text-xs text-slate-500 mt-0.5"></p>
        </div>
      </div>

      <div id="browse-content"></div>
    </section>

    <!-- VIEW: SEARCH & FILTER -->
    <section id="view-search" class="hidden space-y-4">
      <div class="bg-white rounded-2xl border border-gray-200 p-4 space-y-3 shadow-sm">
        <div class="flex flex-col sm:flex-row gap-2.5">
          <input id="search-keyword" type="text" placeholder="输入活动类别、活动、出版社、版面名称或商品番号..." class="flex-1 px-3.5 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/15" />
          <button type="button" id="btn-reset-filters" class="px-4 py-2 rounded-xl border border-gray-200 hover:bg-gray-50 text-sm text-slate-700 font-medium shrink-0">
            重置筛选
          </button>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
          <select id="filter-publisher" class="px-2.5 py-2 rounded-lg border border-gray-200 text-xs sm:text-sm bg-white">
            <option value="">全部出版社</option>
          </select>
          <select id="filter-kind" class="px-2.5 py-2 rounded-lg border border-gray-200 text-xs sm:text-sm bg-white">
            <option value="">团体 / 个人</option>
            <option value="团体">团体</option>
            <option value="个人">个人</option>
          </select>
          <select id="filter-category" class="px-2.5 py-2 rounded-lg border border-gray-200 text-xs sm:text-sm bg-white">
            <option value="">全部活动类别</option>
          </select>
          <select id="filter-event" class="px-2.5 py-2 rounded-lg border border-gray-200 text-xs sm:text-sm bg-white">
            <option value="">全部活动</option>
          </select>
          <select id="filter-status" class="col-span-2 sm:col-span-1 px-2.5 py-2 rounded-lg border border-gray-200 text-xs sm:text-sm bg-white">
            <option value="">全部状态</option>
            <option value="valid">未失效</option>
            <option value="expired">已失效</option>
            <option value="unknown">未设截止时间</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs sm:text-sm text-slate-600">
        <span id="search-result-count"></span>
      </div>

      <div id="search-results-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4"></div>
    </section>

    <!-- VIEW: PRINT LIST -->
    <section id="view-print" class="hidden space-y-4">
      <div class="bg-white rounded-2xl border border-gray-200 p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 class="text-lg font-semibold text-slate-900">便利店待打印清单</h2>
          <p class="text-xs text-slate-500 mt-0.5">统一打印入口：eプリントサービス</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <span id="print-stats" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 font-medium"></span>
          <button type="button" id="btn-clear-printed" class="px-3 py-1.5 rounded-lg border border-gray-200 hover:bg-gray-50 text-xs font-medium text-slate-700">
            清理已打印项
          </button>
          <button type="button" id="btn-export-print-csv" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium">
            导出打印清单
          </button>
        </div>
      </div>

      <div id="print-list-container" class="space-y-3"></div>
    </section>

  </main>

  <!-- MODAL: Image Detail / Lightbox -->
  <div id="modal-detail" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-xs flex items-center justify-center p-2 sm:p-4">
    <div class="bg-white rounded-2xl max-w-5xl w-full max-h-[94vh] overflow-hidden flex flex-col md:flex-row shadow-2xl">
      <!-- Image Preview Area -->
      <div class="relative bg-slate-950 flex-1 min-h-[42vh] md:min-h-[75vh] flex items-center justify-center p-3 select-none">
        <img id="detail-img" src="" alt="版面大图" class="max-h-[50vh] md:max-h-[85vh] max-w-full w-auto h-auto object-contain rounded" />
        <div id="detail-img-empty" class="hidden flex flex-col items-center justify-center text-slate-400 text-sm gap-2">
          <svg class="w-10 h-10 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span>暂无版面图片</span>
        </div>
        <button id="detail-prev" type="button" class="absolute left-2 sm:left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 hover:bg-white text-slate-900 flex items-center justify-center shadow font-bold" title="上一张">‹</button>
        <button id="detail-next" type="button" class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 hover:bg-white text-slate-900 flex items-center justify-center shadow font-bold" title="下一张">›</button>
        <span id="detail-counter" class="absolute bottom-2.5 left-1/2 -translate-x-1/2 px-2.5 py-0.5 rounded-full bg-black/60 text-white text-xs"></span>
        <button id="detail-close-mobile" type="button" class="md:hidden absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-black/60 text-white flex items-center justify-center text-sm">✕</button>
      </div>

      <!-- Info Sidebar -->
      <div class="w-full md:w-96 bg-white flex flex-col max-h-[48vh] md:max-h-[94vh] border-t md:border-t-0 md:border-l border-gray-200">
        <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
          <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">便利店打印</span>
          <button id="detail-close" type="button" class="hidden md:flex w-7 h-7 rounded-lg hover:bg-gray-100 items-center justify-center text-slate-500">✕</button>
        </div>

        <div class="p-4 overflow-y-auto space-y-3 text-sm flex-1">
          <h3 id="detail-title" class="font-semibold text-base text-slate-900"></h3>

          <!-- Product Code Copy Box -->
          <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="text-[11px] text-slate-500">商品番号</div>
              <div id="detail-code" class="font-mono font-semibold text-slate-900 truncate"></div>
            </div>
            <button id="detail-copy-code" type="button" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium shrink-0 transition">
              复制番号
            </button>
          </div>

          <dl class="grid grid-cols-3 gap-y-2 text-xs sm:text-sm">
            <dt class="text-slate-500">出版社</dt><dd id="detail-publisher" class="col-span-2 font-medium text-slate-900"></dd>
            <dt class="text-slate-500">分类</dt><dd id="detail-kind" class="col-span-2 text-slate-900"></dd>
            <dt id="detail-category-label" class="text-slate-500">活动类别</dt><dd id="detail-category" class="col-span-2 font-medium text-slate-900"></dd>
            <dt class="text-slate-500">活动</dt><dd id="detail-event" class="col-span-2 text-slate-900"></dd>
            <dt class="text-slate-500">截止时间</dt><dd id="detail-deadline" class="col-span-2 text-slate-900"></dd>
            <dt class="text-slate-500">原始链接</dt><dd id="detail-source" class="col-span-2 truncate"></dd>
            <dt class="text-slate-500">备注</dt><dd id="detail-notes" class="col-span-2 text-slate-700 whitespace-pre-wrap"></dd>
          </dl>
        </div>

        <div class="p-3.5 border-t border-gray-100 space-y-2 bg-gray-50/70">
          <button id="detail-toggle-print" type="button" class="w-full py-2 rounded-xl text-sm font-medium transition"></button>
          <p id="detail-print-hint" class="text-[11px] text-amber-700 text-center hidden"></p>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button id="detail-edit" type="button" class="py-1.5 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-xs font-medium text-slate-700">编辑 / 换图</button>
            <button id="detail-delete" type="button" class="py-1.5 rounded-lg border border-rose-200 bg-white hover:bg-rose-50 text-xs font-medium text-rose-600">删除记录</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: Upload / Edit Edition -->
  <div id="modal-form" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-3">
    <div class="bg-white rounded-2xl max-w-xl w-full max-h-[92vh] overflow-hidden flex flex-col shadow-xl">
      <div class="px-5 py-3.5 border-b border-gray-100 flex items-center justify-between">
        <h3 id="form-modal-title" class="font-semibold text-base text-slate-900">录入新闻版面</h3>
        <button id="form-close" type="button" class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center text-slate-500">✕</button>
      </div>

      <form id="edition-form" class="p-5 overflow-y-auto space-y-4 text-sm flex-1">
        <input type="hidden" id="form-id" />

        <!-- Image Upload / Preview -->
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1.5">版面图片 *</label>
          <div class="flex items-start gap-3">
            <div class="w-24 h-32 rounded-xl border border-dashed border-gray-300 bg-gray-50 flex items-center justify-center overflow-hidden shrink-0">
              <img id="form-img-preview" src="" alt="预览" class="w-full h-full object-contain hidden" />
              <span id="form-img-placeholder" class="text-[11px] text-gray-400 text-center px-1">暂无图片</span>
            </div>
            <div class="flex-1 space-y-2">
              <input id="form-file" type="file" accept="image/*" class="block w-full text-xs text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-slate-900 file:text-white hover:file:bg-slate-800" />
              <p class="text-[11px] text-slate-500">支持本地上传新闻截图或照片（自动压缩后保存在浏览器本地数据库）。编辑时若不重新选图，将保留原图。</p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">出版社 *</label>
            <select id="form-publisher" required class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">团体 / 个人 *</label>
            <select id="form-kind" required class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white">
              <option value="个人">个人</option>
              <option value="团体">团体</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div id="form-category-wrapper">
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-medium text-slate-700">活动类别 *</label>
              <button type="button" id="btn-toggle-new-category" class="text-[11px] text-blue-600 hover:underline">+ 新建</button>
            </div>
            <select id="form-category-select" class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white"></select>
            <input id="form-category-new" type="text" placeholder="输入新的活动类别（如：演唱会、电影）" class="hidden w-full px-3 py-2 rounded-xl border border-blue-300 mt-1.5" />
          </div>
          <div id="form-event-wrapper">
            <div class="flex items-center justify-between mb-1">
              <label id="form-event-label" class="text-xs font-medium text-slate-700">具体活动名称 *</label>
              <button type="button" id="btn-toggle-new-event" class="text-[11px] text-blue-600 hover:underline">+ 新建</button>
            </div>
            <select id="form-event-select" class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white"></select>
            <input id="form-event-new" type="text" placeholder="输入新的活动名称" class="hidden w-full px-3 py-2 rounded-xl border border-blue-300 mt-1.5" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">版面名称 / 编号 *</label>
            <input id="form-title" type="text" required placeholder="例如：亚洲巡演报道①" class="w-full px-3 py-2 rounded-xl border border-gray-200" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">截止时间</label>
            <input id="form-deadline" type="date" class="w-full px-3 py-2 rounded-xl border border-gray-200" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">商品番号</label>
          <input id="form-code" type="text" placeholder="例如：NKSP-261110-01" class="w-full px-3 py-2 rounded-xl border border-gray-200 font-mono" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">原始链接（X 或官方网站）</label>
          <input id="form-source" type="url" placeholder="https://x.com/..." class="w-full px-3 py-2 rounded-xl border border-gray-200" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">备注</label>
          <textarea id="form-notes" rows="2" placeholder="尺寸、打印截止日期或购买说明..." class="w-full px-3 py-2 rounded-xl border border-gray-200"></textarea>
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" id="form-cancel" class="px-4 py-2 rounded-xl border border-gray-200 hover:bg-gray-50 text-sm font-medium">取消</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium">保存版面</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Category Input (Add / Rename) -->
  <div id="modal-cat" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-3">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
      <h3 id="cat-modal-title" class="font-semibold text-base text-slate-900"></h3>

  <script>
    const STORAGE_KEY = 'jp_news_archive_v1';
    const IDB_NAME = 'ry_cover_archive_db';
    const IDB_STORE = 'app_data';
    const IDB_VERSION = 1;

    const GH_CFG_KEY = 'ry_gh_sync_cfg_v1';
    let ghSyncTimer = null;
    let ghIsSyncing = false;

    function detectGitHubRepoFromUrl() {
      const host = window.location.hostname || '';
      if (!host.endsWith('.github.io')) return '';
      const owner = host.replace('.github.io', '');
      const parts = (window.location.pathname || '/').split('/').filter(Boolean);
      const repo = parts[0] || `${owner}.github.io`;
      return `${owner}/${repo}`;
    }

    function loadGhConfig() {
      try {
        const raw = localStorage.getItem(GH_CFG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { repo: detectGitHubRepoFromUrl(), branch: 'main', token: '', autoSync: true };
    }

    function saveGhConfig(cfg) {
      try {
        localStorage.setItem(GH_CFG_KEY, JSON.stringify(cfg));
      } catch (e) {}
    }

    function setSyncIndicator(status, text) {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('gh-sync-status');
      if (dot) {
        dot.className = 'w-2 h-2 rounded-full ' + (
          status === 'ok' ? 'bg-emerald-500' :
          status === 'syncing' ? 'bg-amber-400 animate-pulse' :
          status === 'err' ? 'bg-rose-500' : 'bg-slate-300'
        );
      }
      if (label && text) label.textContent = text;
    }

    function utf8ToBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    async function ghGetFileSha(repo, branch, path, token) {
      const url = `https://api.github.com/repos/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}`;
      const res = await fetch(url, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json'
        }
      });
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('GitHub API ' + res.status);
      const data = await res.json();
      return data.sha || null;
    }

    async function ghPutFile(repo, branch, path, base64Content, message, token) {
      const sha = await ghGetFileSha(repo, branch, path, token);
      const url = `https://api.github.com/repos/${repo}/contents/${path}`;
      const body = { message, content: base64Content, branch };
      if (sha) body.sha = sha;
      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || ('上传失败 ' + res.status));
      }
      return res.json();
    }

    async function pullFromGitHub(silent = false) {
      const cfg = loadGhConfig();
      const repo = (cfg.repo || detectGitHubRepoFromUrl() || '').trim();
      const branch = (cfg.branch || 'main').trim();
      if (!repo) {
        if (!silent) showToast('请先填写 GitHub 用户名/仓库名');
        return false;
      }
      setSyncIndicator('syncing', '正在拉取...');
      try {
        let parsed = null;
        if (cfg.token) {
          const apiUrl = `https://api.github.com/repos/${repo}/contents/archive_data.json?ref=${encodeURIComponent(branch)}&_=${Date.now()}`;
          const res = await fetch(apiUrl, {
            headers: {
              'Authorization': `Bearer ${cfg.token}`,
              'Accept': 'application/vnd.github.raw'
            }
          });
          if (res.ok) parsed = await res.json();
        }
        if (!parsed) {
          const rawUrl = `https://raw.githubusercontent.com/${repo}/${encodeURIComponent(branch)}/archive_data.json?t=${Date.now()}`;
          const res = await fetch(rawUrl);
          if (res.ok) parsed = await res.json();
        }
        if (parsed && Array.isArray(parsed.publishers) && Array.isArray(parsed.editions)) {
          state.data = normalizeData(parsed);
          await idbSet(STORAGE_KEY, state.data);
          renderCurrentView();
          setSyncIndicator('ok', `已同步 (${repo})`);
          if (!silent) showToast('已从 GitHub 拉取最新数据');
          return true;
        }
        setSyncIndicator(cfg.token ? 'ok' : 'idle', cfg.token ? '云端暂无存档文件' : '未配置');
        if (!silent) showToast('云端尚未找到 archive_data.json，可先点击上传');
        return false;
      } catch (e) {
        setSyncIndicator('err', '拉取失败');
        if (!silent) showToast('从 GitHub 拉取失败：' + e.message);
        return false;
      }
    }

    async function pushToGitHub(silent = false) {
      if (ghIsSyncing) return;
      const cfg = loadGhConfig();
      const repo = (cfg.repo || '').trim();
      const branch = (cfg.branch || 'main').trim();
      const token = (cfg.token || '').trim();
      if (!repo || !token) {
        if (!silent) showToast('请填写仓库名和 GitHub Token');
        return;
      }
      ghIsSyncing = true;
      setSyncIndicator('syncing', '正在同步到 GitHub...');
      try {
        let imgUploaded = 0;
        for (const ed of state.data.editions) {
          if (ed.imageUrl && ed.imageUrl.startsWith('data:image/')) {
            const commaIdx = ed.imageUrl.indexOf(',');
            if (commaIdx !== -1) {
              const b64 = ed.imageUrl.slice(commaIdx + 1);
              const ext = ed.imageUrl.includes('image/png') ? 'png' : 'jpg';
              const imgPath = `images/${ed.id}.${ext}`;
              await ghPutFile(repo, branch, imgPath, b64, `Upload image ${ed.id}`, token);
              ed.imageUrl = `https://raw.githubusercontent.com/${repo}/${encodeURIComponent(branch)}/${imgPath}`;
              imgUploaded++;
            }
          }
        }
        const jsonStr = JSON.stringify(state.data, null, 2);
        await ghPutFile(repo, branch, 'archive_data.json', utf8ToBase64(jsonStr), 'Update archive_data.json', token);
        await idbSet(STORAGE_KEY, state.data);
        setSyncIndicator('ok', `已同步 (${repo})`);
        if (!silent) showToast(imgUploaded ? `云端同步成功（含 ${imgUploaded} 张图片）` : '云端同步成功');
      } catch (e) {
        setSyncIndicator('err', '同步失败');
        if (!silent) showToast('同步失败：' + e.message);
      } finally {
        ghIsSyncing = false;
      }
    }

    function scheduleAutoSync() {
      const cfg = loadGhConfig();
      if (!cfg.token || !cfg.repo || !cfg.autoSync) return;
      clearTimeout(ghSyncTimer);
      ghSyncTimer = setTimeout(() => { pushToGitHub(true); }, 1200);
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB not supported'));
          return;
        }
        const req = indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('Failed to open DB'));
      });
    }

    async function idbGet(key) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const store = tx.objectStore(IDB_STORE);
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbSet(key, value) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.put(value, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function compressImageFile(file, maxDim = 1600, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('读取图片失败'));
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          const img = new Image();
          img.onerror = () => resolve(dataUrl);
          img.onload = () => {
            try {
              let { width, height } = img;
              if (width <= maxDim && height <= maxDim && file.size <= 300 * 1024) {
                resolve(dataUrl);
                return;
              }
              if (width > height && width > maxDim) {
                height = Math.round(height * (maxDim / width));
                width = maxDim;
              } else if (height > maxDim) {
                width = Math.round(width * (maxDim / height));
                height = maxDim;
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const compressed = canvas.toDataURL('image/jpeg', quality);
              resolve(compressed.length < dataUrl.length ? compressed : dataUrl);
            } catch (e) {
              resolve(dataUrl);
            }
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
      });
    }

    function getTodayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getExpiryStatus(deadline) {
      if (!deadline) return 'unknown';
      return deadline < getTodayStr() ? 'expired' : 'valid';

      if (!deadline) return '未设截止时间';
      const today = getTodayStr();
      if (deadline < today) return '已失效';
      if (deadline === today) return '今日截止';
      return '未失效';
    }

    function normalizeData(raw) {
      const publishers = Array.isArray(raw.publishers) ? raw.publishers : [];
      const rawCats = Array.isArray(raw.categories)
        ? raw.categories
        : (Array.isArray(raw.subjects) ? raw.subjects.filter(s => s.kind === '个人') : []);

      const catIdMap = {};
      const catByName = {};
      const categories = [];
      rawCats.forEach(c => {
        const name = (c.name || '').trim();
        if (!name) return;
        if (!catByName[name]) {
          const canonical = { id: c.id, kind: '个人', name };
          catByName[name] = canonical;
          categories.push(canonical);
        }
        catIdMap[c.id] = catByName[name].id;
      });

      const evtIdMap = {};
      const evtByKey = {};
      const events = [];
      (Array.isArray(raw.events) ? raw.events : []).forEach(ev => {
        const kind = ev.kind || '个人';
        const rawCatId = kind === '团体' ? '' : (ev.categoryId ?? ev.subjectId ?? '');
        const canonicalCatId = kind === '团体' ? '' : (catIdMap[rawCatId] || rawCatId);
        const name = (ev.name || '').trim();
        if (!name) return;
        const key = `${kind}::${canonicalCatId}::${name}`;
        if (!evtByKey[key]) {
          const canonical = { id: ev.id, kind, categoryId: canonicalCatId, name };
          evtByKey[key] = canonical;
          events.push(canonical);
        }
        evtIdMap[ev.id] = evtByKey[key].id;
      });

      const editions = (Array.isArray(raw.editions) ? raw.editions : []).map(ed => {
        const kind = ed.kind || '个人';
        const rawCatId = kind === '团体' ? '' : (ed.categoryId ?? ed.subjectId ?? '');
        const canonicalCatId = kind === '团体' ? '' : (catIdMap[rawCatId] || rawCatId);
        const canonicalEvtId = evtIdMap[ed.eventId] || ed.eventId;
        return {
          ...ed,
          categoryId: canonicalCatId,
          eventId: canonicalEvtId,
          deadline: ed.deadline ?? ed.publishDate ?? ''
        };
      });

      return { publishers, categories, events, editions };
    }

    let state = {

    async function loadData() {
      try {
        const stored = await idbGet(STORAGE_KEY);
        if (stored && Array.isArray(stored.publishers) && Array.isArray(stored.editions)) {
          return normalizeData(stored);
        }
      } catch (e) {}

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.publishers) && Array.isArray(parsed.editions)) {
            const migrated = normalizeData(parsed);
            try { await idbSet(STORAGE_KEY, migrated); } catch (e) {}
            return migrated;
          }
        }
      } catch (e) {}

      const def = createDefaultData();
      try { await idbSet(STORAGE_KEY, def); } catch (e) {}
      return def;
    }

      idbSet(STORAGE_KEY, state.data).then(() => {
        scheduleAutoSync();

        showToast('保存失败：浏览器本地存储空间不足或权限受限');
      });

    function uid(prefix) {
      return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function copyText(text) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('已复制商品番号：' + text);
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('已复制商品番号：' + text);
      } catch (e) {
        showToast('复制失败，请手动长按复制');
      }
      document.body.removeChild(ta);
    }

    function getPublisher(id) { return state.data.publishers.find(p => p.id === id); }
    function getCategory(id) { return state.data.categories.find(c => c.id === id); }
    function getEvent(id) { return state.data.events.find(e => e.id === id); }

    function updatePrintBadges() {
      const pending = state.data.editions.filter(e => e.inPrintList && !e.printed).length;
      document.getElementById('badge-print-desktop').textContent = pending;
      document.getElementById('badge-print-mobile').textContent = pending;
    }

    function switchView(viewName) {
      state.view = viewName;
      ['home', 'browse', 'search', 'print'].forEach(v => {
        document.getElementById('view-' + v).classList.toggle('hidden', v !== viewName);
      });
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const active = btn.dataset.view === viewName;
        btn.className = btn.className.replace(/bg-slate-900 text-white|text-slate-600 hover:bg-gray-100/g, '').trim();
        if (active) {
          btn.classList.add('bg-slate-900', 'text-white');
        } else {
          btn.classList.add('text-slate-600', 'hover:bg-gray-100');
        }
      });
      renderCurrentView();
    }

    function renderCurrentView() {
      updatePrintBadges();
      if (state.view === 'home') renderHome();
      if (state.view === 'browse') renderBrowse();
      if (state.view === 'search') renderSearch();
      if (state.view === 'print') renderPrintList();
    }

    function createEditionCard(ed, listForLightbox) {
      const pub = getPublisher(ed.publisherId);
      const cat = getCategory(ed.categoryId);
      const evt = getEvent(ed.eventId);
      const expiryStatus = getExpiryStatus(ed.deadline);

      const card = document.createElement('div');
      card.className = 'group bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-xs hover:shadow-md transition flex flex-col cursor-pointer';

      let statusBadge = '';
      if (expiryStatus === 'expired') {
        statusBadge = '<span class="absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-medium bg-slate-800/80 text-white">已失效</span>';
      }

      card.innerHTML = `
        <div class="relative bg-slate-100 aspect-[3/4] overflow-hidden flex items-center justify-center">
          ${ed.imageUrl
            ? `<img src="${ed.imageUrl}" alt="${ed.title}" class="w-full h-full object-contain group-hover:scale-[1.02] transition duration-200" />`
            : `<div class="flex flex-col items-center justify-center text-slate-400 text-xs gap-1.5"><svg class="w-8 h-8 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span>暂无图片</span></div>`
          }
          ${statusBadge}
          ${ed.inPrintList ? `<span class="absolute top-2 right-2 px-2 py-0.5 rounded-full text-[10px] font-medium bg-rose-600 text-white">${ed.printed ? '已打印' : '待打印'}</span>` : ''}
        </div>
        <div class="p-3 space-y-1 flex-1 flex flex-col justify-between">
          <div>
            <div class="text-xs font-semibold text-slate-900 line-clamp-1">${ed.title}</div>
            <div class="text-[11px] text-slate-500 mt-0.5 line-clamp-1">${[pub ? pub.name : '', cat ? cat.name : '', evt ? evt.name : ''].filter(Boolean).join(' · ')}</div>
            ${ed.deadline ? `<div class="text-[10px] mt-0.5 ${expiryStatus === 'expired' ? 'text-slate-400 line-through' : 'text-emerald-700'}">截止：${ed.deadline}</div>` : ''}
          </div>
          <div class="pt-1.5 flex items-center justify-between gap-1 border-t border-gray-100 mt-1.5">
            <span class="text-[11px] font-mono ${ed.productCode ? 'text-slate-700 font-medium' : 'text-slate-400'} truncate">${ed.productCode || '无番号'}</span>
            ${ed.productCode ? `<button type="button" class="copy-mini px-2 py-0.5 rounded bg-gray-100 hover:bg-gray-200 text-[10px] text-slate-700 font-medium shrink-0">复制</button>` : ''}
          </div>
        </div>
      `;

      const copyBtn = card.querySelector('.copy-mini');
      if (copyBtn) {
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          copyText(ed.productCode);
        });
      }

      card.addEventListener('click', () => {
        const idx = listForLightbox.findIndex(item => item.id === ed.id);
        openDetailModal(listForLightbox, Math.max(0, idx));
      });

      return card;
    }

    function renderHome() {
      const pubGrid = document.getElementById('home-publishers-grid');
      pubGrid.innerHTML = '';
      state.data.publishers.forEach(pub => {
        const count = state.data.editions.filter(e => e.publisherId === pub.id).length;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'bg-white rounded-2xl border border-gray-200 p-3.5 text-left hover:border-slate-400 hover:shadow-xs transition';
        btn.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <div class="font-semibold text-sm sm:text-base text-slate-900 truncate">${pub.name}</div>
            <span class="text-xs text-slate-400 shrink-0">${count} 版面</span>
          </div>
          <div class="text-[11px] text-slate-500 mt-1 truncate">${pub.source || '官方X账号'}</div>
        `;
        btn.addEventListener('click', () => {
          state.browse = { publisherId: pub.id, kind: null, categoryId: null, eventId: null };
          switchView('browse');
        });
        pubGrid.appendChild(btn);
      });

      const sorted = [...state.data.editions].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      document.getElementById('home-total-count').textContent = `共收录 ${sorted.length} 张版面`;
      const recentGrid = document.getElementById('home-recent-grid');
      recentGrid.innerHTML = '';
      if (sorted.length === 0) {
        recentGrid.innerHTML = '<div class="col-span-full text-center py-10 text-sm text-slate-500">暂无版面记录，点击右上角「+ 录入版面」开始添加。</div>';
        return;
      }
      sorted.slice(0, 8).forEach(ed => recentGrid.appendChild(createEditionCard(ed, sorted)));
    }

    function renderBrowse() {
      const { publisherId, kind, categoryId, eventId } = state.browse;
      const bc = document.getElementById('browse-breadcrumbs');
      const backBtn = document.getElementById('btn-browse-back');
      const addBtn = document.getElementById('btn-browse-add-child');
      const titleEl = document.getElementById('browse-title');
      const subEl = document.getElementById('browse-subtitle');
      const content = document.getElementById('browse-content');
      content.innerHTML = '';

      const crumbs = [{ label: '全部出版社', action: () => { state.browse = { publisherId: null, kind: null, categoryId: null, eventId: null }; renderBrowse(); } }];
      const pub = publisherId ? getPublisher(publisherId) : null;
      const cat = categoryId ? getCategory(categoryId) : null;
      const evt = eventId ? getEvent(eventId) : null;

      if (pub) crumbs.push({ label: pub.name, action: () => { state.browse = { publisherId, kind: null, categoryId: null, eventId: null }; renderBrowse(); } });
      if (kind) crumbs.push({ label: kind, action: () => { state.browse = { publisherId, kind, categoryId: null, eventId: null }; renderBrowse(); } });
      if (cat) crumbs.push({ label: cat.name, action: () => { state.browse = { publisherId, kind, categoryId, eventId: null }; renderBrowse(); } });
      if (evt) crumbs.push({ label: evt.name, action: null });

      bc.innerHTML = '';
      crumbs.forEach((c, idx) => {
        if (idx > 0) {
          const sep = document.createElement('span');
          sep.className = 'text-slate-300';
          sep.textContent = '/';
          bc.appendChild(sep);
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = c.label;
        if (idx === crumbs.length - 1) {
          btn.className = 'font-semibold text-slate-900';
        } else {
          btn.className = 'text-slate-500 hover:text-slate-900 hover:underline';
          btn.addEventListener('click', c.action);
        }
        bc.appendChild(btn);
      });

      backBtn.classList.toggle('hidden', crumbs.length <= 1);

      // Publishers
      if (!publisherId) {
        titleEl.textContent = '选择出版社';
        subEl.textContent = '支持新增、修改或删除出版社';
        addBtn.textContent = '+ 新增出版社';
        addBtn.classList.remove('hidden');
        addBtn.onclick = () => openCatModal('新增出版社', '', (val) => {
          state.data.publishers.push({ id: uid('pub'), name: val, source: '官方X账号' });
          saveData();
          renderBrowse();
        });

        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3';
        state.data.publishers.forEach(p => {
          const cnt = state.data.editions.filter(e => e.publisherId === p.id).length;
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl border border-gray-200 p-4 flex flex-col justify-between gap-3 hover:border-slate-400 transition cursor-pointer';
          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between gap-2">
                <div class="text-base font-semibold text-slate-900">${p.name}</div>
                <span class="text-xs text-slate-500 shrink-0">${cnt} 张版面</span>
              </div>
            </div>
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-gray-100 text-xs">
              <button type="button" class="cat-edit text-slate-500 hover:text-slate-900">重命名</button>
              <button type="button" class="cat-del text-rose-500 hover:text-rose-700">删除</button>
            </div>
          `;
          card.addEventListener('click', () => { state.browse = { publisherId: p.id, kind: null, categoryId: null, eventId: null }; renderBrowse(); });
          card.querySelector('.cat-edit').addEventListener('click', (e) => {
            e.stopPropagation();
            openCatModal('重命名出版社', p.name, (val) => { p.name = val; saveData(); renderBrowse(); });
          });
          card.querySelector('.cat-del').addEventListener('click', (e) => {
            e.stopPropagation();
            openConfirmModal(`删除出版社「${p.name}」`, '删除后将同时移除该出版社下的分类和版面记录，确定继续吗？', () => {
              state.data.publishers = state.data.publishers.filter(x => x.id !== p.id);
              state.data.editions = state.data.editions.filter(x => x.publisherId !== p.id);
              saveData();
              renderBrowse();
            });
          });
          grid.appendChild(card);
        });
        content.appendChild(grid);
        return;
      }

      // Group vs Solo
      if (!kind) {
        titleEl.textContent = `${pub.name} · 团体 / 个人`;
        subEl.textContent = '同一场活动若同时有团体和个人版面，可分别归档';
        addBtn.classList.add('hidden');

        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-4';
        ['团体', '个人'].forEach(k => {
          const edCount = state.data.editions.filter(e => e.publisherId === publisherId && e.kind === k).length;
          const subCount = k === '团体'
            ? state.data.events.filter(ev => ev.kind === '团体').length
            : state.data.categories.filter(c => c.kind === '个人').length;
          const countLabel = k === '团体' ? `${subCount} 个活动` : `${subCount} 个活动类别`;
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'bg-white rounded-2xl border border-gray-200 p-6 text-left hover:border-slate-900 hover:shadow-xs transition';
          card.innerHTML = `
            <div class="text-xs text-slate-500">${pub.name}</div>
            <div class="text-xl font-semibold text-slate-900 mt-1">${k}</div>
            <div class="text-xs text-slate-500 mt-2">${countLabel} · ${edCount} 张版面</div>
          `;
          card.addEventListener('click', () => { state.browse.kind = k; renderBrowse(); });
          grid.appendChild(card);
        });
        content.appendChild(grid);
        return;
      }

      // Solo: Event Categories (个人 -> 活动类别 -> 具体活动名称)
      if (kind === '个人' && !categoryId) {
        titleEl.textContent = `${pub.name} · 个人 · 选择活动类别`;
        subEl.textContent = '点击进入查看该类别下的具体活动';
        addBtn.textContent = '+ 新增活动类别';
        addBtn.classList.remove('hidden');
        addBtn.onclick = () => openCatModal('新增活动类别', '', (val) => {
          if (!state.data.categories.some(c => c.kind === '个人' && c.name === val)) {
            state.data.categories.push({ id: uid('cat'), kind: '个人', name: val });
            saveData();
          } else {
            showToast('该活动类别已存在');
          }
          renderBrowse();
        });

        const list = state.data.categories.filter(c => c.kind === '个人');
        if (list.length === 0) {
          content.innerHTML = '<div class="bg-white rounded-2xl border border-gray-200 p-8 text-center text-sm text-slate-500">暂无活动类别，请点击右上角「+ 新增活动类别」。</div>';
          return;
        }
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3';
        list.forEach(c => {
          const evtCnt = state.data.events.filter(ev => ev.categoryId === c.id).length;
          const edCnt = state.data.editions.filter(ed => ed.publisherId === publisherId && ed.categoryId === c.id).length;
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl border border-gray-200 p-4 flex flex-col justify-between gap-3 hover:border-slate-400 transition cursor-pointer';
          card.innerHTML = `
            <div>
              <div class="text-base font-semibold text-slate-900">${c.name}</div>
              <div class="text-xs text-slate-500 mt-1">${evtCnt} 个具体活动 · ${edCnt} 张版面</div>
            </div>
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-gray-100 text-xs">
              <button type="button" class="cat-edit text-slate-500 hover:text-slate-900">重命名</button>
              <button type="button" class="cat-del text-rose-500 hover:text-rose-700">删除</button>
            </div>
          `;
          card.addEventListener('click', () => { state.browse.categoryId = c.id; renderBrowse(); });
          card.querySelector('.cat-edit').addEventListener('click', (e) => {
            e.stopPropagation();
            openCatModal('重命名活动类别', c.name, (val) => { c.name = val; saveData(); renderBrowse(); });
          });
          card.querySelector('.cat-del').addEventListener('click', (e) => {
            e.stopPropagation();
            openConfirmModal(`删除活动类别「${c.name}」`, '将同时移除其下属具体活动和版面记录，确定继续吗？', () => {
              state.data.categories = state.data.categories.filter(x => x.id !== c.id);
              state.data.events = state.data.events.filter(x => x.categoryId !== c.id);
              state.data.editions = state.data.editions.filter(x => x.categoryId !== c.id);
              saveData();
              renderBrowse();
            });
          });
          grid.appendChild(card);
        });
        content.appendChild(grid);
        return;
      }

      // Events (团体: 活动 / 个人: 具体活动名称)
      if (!eventId) {
        titleEl.textContent = kind === '团体' ? `${pub.name} · 团体 · 选择活动` : `${cat.name} · 选择具体活动`;
        subEl.textContent = kind === '团体' ? `${pub.name} / 团体` : `${pub.name} / 个人 / ${cat.name}`;
        addBtn.textContent = kind === '团体' ? '+ 新增活动' : '+ 新增具体活动';
        addBtn.classList.remove('hidden');
        addBtn.onclick = () => openCatModal(kind === '团体' ? '新增活动' : '新增具体活动', '', (val) => {
          const targetCatId = kind === '团体' ? '' : categoryId;
          if (!state.data.events.some(ev => ev.kind === kind && ev.categoryId === targetCatId && ev.name === val)) {
            state.data.events.push({ id: uid('evt'), kind, categoryId: targetCatId, name: val });
            saveData();
          } else {
            showToast('该活动已存在');
          }
          renderBrowse();
        });

        const list = kind === '团体'
          ? state.data.events.filter(ev => ev.kind === '团体')
          : state.data.events.filter(ev => ev.categoryId === categoryId);

        if (list.length === 0) {
          content.innerHTML = '<div class="bg-white rounded-2xl border border-gray-200 p-8 text-center text-sm text-slate-500">暂无活动记录，请点击右上角新增。</div>';
          return;
        }
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3';
        list.forEach(ev => {
          const eds = state.data.editions.filter(ed => ed.publisherId === publisherId && ed.eventId === ev.id);
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl border border-gray-200 p-4 flex flex-col justify-between gap-3 hover:border-slate-400 transition cursor-pointer';
          card.innerHTML = `
            <div>
              <div class="text-base font-semibold text-slate-900">${ev.name}</div>
              <div class="text-xs text-slate-500 mt-1">已收录 ${eds.length} 张新闻版面</div>
            </div>
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-gray-100 text-xs">
              <button type="button" class="cat-edit text-slate-500 hover:text-slate-900">重命名</button>
              <button type="button" class="cat-del text-rose-500 hover:text-rose-700">删除</button>
            </div>
          `;
          card.addEventListener('click', () => { state.browse.eventId = ev.id; renderBrowse(); });
          card.querySelector('.cat-edit').addEventListener('click', (e) => {
            e.stopPropagation();
            openCatModal('重命名活动', ev.name, (val) => { ev.name = val; saveData(); renderBrowse(); });
          });
          card.querySelector('.cat-del').addEventListener('click', (e) => {
            e.stopPropagation();
            openConfirmModal(`删除活动「${ev.name}」`, '将同时移除该活动下的所有版面记录，确定继续吗？', () => {
              state.data.events = state.data.events.filter(x => x.id !== ev.id);
              state.data.editions = state.data.editions.filter(x => x.eventId !== ev.id);
              saveData();
              renderBrowse();
            });
          });
          grid.appendChild(card);
        });
        content.appendChild(grid);
        return;
      }

      // Editions Photo Wall
      titleEl.textContent = `${evt.name} · 版面图片墙`;
      subEl.textContent = [pub.name, kind, cat ? cat.name : '', evt.name].filter(Boolean).join(' / ');
      addBtn.textContent = '+ 上传版面';
      addBtn.classList.remove('hidden');
      addBtn.onclick = () => openUploadModal({ publisherId, kind, categoryId, eventId });

      const eds = state.data.editions.filter(ed => ed.publisherId === publisherId && ed.eventId === eventId);
      if (eds.length === 0) {
        content.innerHTML = '<div class="bg-white rounded-2xl border border-gray-200 p-8 text-center text-sm text-slate-500">该活动下暂无版面图片，点击右上角「+ 上传版面」添加。</div>';
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4';
      eds.forEach(ed => grid.appendChild(createEditionCard(ed, eds)));
      content.appendChild(grid);
    }

    function populateSearchFilters() {
      const pubSel = document.getElementById('filter-publisher');
      const curPub = pubSel.value;
      pubSel.innerHTML = '<option value="">全部出版社</option>';
      state.data.publishers.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        pubSel.appendChild(opt);
      });
      pubSel.value = state.data.publishers.some(p => p.id === curPub) ? curPub : '';

      const kind = document.getElementById('filter-kind').value;

      const catSel = document.getElementById('filter-category');
      const curCat = catSel.value;
      catSel.innerHTML = '<option value="">全部活动类别</option>';
      if (kind === '团体') {
        catSel.disabled = true;
        catSel.classList.add('opacity-50');
      } else {
        catSel.disabled = false;
        catSel.classList.remove('opacity-50');
        const uniqueCats = [...new Set(state.data.categories.filter(c => c.kind === '个人').map(c => c.name))];
        uniqueCats.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          catSel.appendChild(opt);
        });
        catSel.value = uniqueCats.includes(curCat) ? curCat : '';
      }

      const catName = catSel.value;

      const evtSel = document.getElementById('filter-event');
      const curEvt = evtSel.value;
      evtSel.innerHTML = '<option value="">全部活动</option>';
      const matchedEvents = state.data.events.filter(e => {
        if (kind && e.kind !== kind) return false;
        if (catName) {
          const c = getCategory(e.categoryId);
          if (!c || c.name !== catName) return false;
        }
        return true;
      });
      const uniqueEvents = [...new Set(matchedEvents.map(e => e.name))];
      uniqueEvents.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        evtSel.appendChild(opt);
      });
      evtSel.value = uniqueEvents.includes(curEvt) ? curEvt : '';
    }

    function renderSearch() {
      populateSearchFilters();
      const kw = document.getElementById('search-keyword').value.trim().toLowerCase();
      const pubId = document.getElementById('filter-publisher').value;
      const kind = document.getElementById('filter-kind').value;
      const catName = document.getElementById('filter-category').value;
      const evtName = document.getElementById('filter-event').value;
      const statusVal = document.getElementById('filter-status').value;

      const filtered = state.data.editions.filter(ed => {
        if (pubId && ed.publisherId !== pubId) return false;
        if (kind && ed.kind !== kind) return false;
        const cat = getCategory(ed.categoryId);
        if (catName && (!cat || cat.name !== catName)) return false;
        const evt = getEvent(ed.eventId);
        if (evtName && (!evt || evt.name !== evtName)) return false;
        if (statusVal && getExpiryStatus(ed.deadline) !== statusVal) return false;
        if (kw) {
          const pub = getPublisher(ed.publisherId);
          const hay = [
            ed.title,
            ed.productCode,
            ed.notes,
            ed.deadline,
            pub ? pub.name : '',
            cat ? cat.name : '',
            evt ? evt.name : '',
            ed.kind
          ].join(' ').toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

      const validCnt = filtered.filter(e => getExpiryStatus(e.deadline) === 'valid').length;
      const expCnt = filtered.filter(e => getExpiryStatus(e.deadline) === 'expired').length;
      document.getElementById('search-result-count').textContent = `共找到 ${filtered.length} 张符合条件的版面（未失效 ${validCnt} · 已失效 ${expCnt}）`;

      const grid = document.getElementById('search-results-grid');
      grid.innerHTML = '';
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full bg-white rounded-2xl border border-gray-200 p-10 text-center text-sm text-slate-500">没有匹配的版面，请尝试更换关键词或筛选条件。</div>';
        return;
      }
      filtered.forEach(ed => grid.appendChild(createEditionCard(ed, filtered)));
    }

    function refreshFormCategories(selectedName = null) {
      const kind = document.getElementById('form-kind').value;
      const wrapper = document.getElementById('form-category-wrapper');
      const evtLabel = document.getElementById('form-event-label');
      const sel = document.getElementById('form-category-select');
      const prevVal = selectedName !== null ? selectedName : sel.value;
      if (kind === '团体') {
        wrapper.classList.add('hidden');
        evtLabel.textContent = '活动名称 *';
        sel.innerHTML = '';
        return;
      }
      wrapper.classList.remove('hidden');
      evtLabel.textContent = '具体活动名称 *';
      const uniqueNames = [...new Set(state.data.categories.filter(c => c.kind === '个人').map(c => c.name))];
      sel.innerHTML = '';
      if (uniqueNames.length === 0) {
        sel.innerHTML = '<option value="">（暂无，请点击右上角新建）</option>';
      } else {
        uniqueNames.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          sel.appendChild(opt);
        });
        if (prevVal && uniqueNames.includes(prevVal)) sel.value = prevVal;
      }
    }

    function refreshFormEvents(selectedName = null) {
      const kind = document.getElementById('form-kind').value;
      const catName = document.getElementById('form-category-select').value;
      const sel = document.getElementById('form-event-select');
      const prevVal = selectedName !== null ? selectedName : sel.value;
      const matched = kind === '团体'
        ? state.data.events.filter(e => e.kind === '团体')
        : state.data.events.filter(e => {
            if (e.kind !== '个人') return false;
            if (!catName) return true;
            const c = getCategory(e.categoryId);
            return c && c.name === catName;
          });
      const uniqueNames = [...new Set(matched.map(e => e.name))];
      sel.innerHTML = '';
      if (uniqueNames.length === 0) {
        sel.innerHTML = '<option value="">（暂无，请点击右上角新建）</option>';
      } else {
        uniqueNames.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          sel.appendChild(opt);
        });
        if (prevVal && uniqueNames.includes(prevVal)) sel.value = prevVal;
      }
    }

    function mergeImportedData(raw) {
      const incoming = normalizeData(raw);
      const pubIdMap = {};
      incoming.publishers.forEach(p => {
        const existing = state.data.publishers.find(x => x.id === p.id || x.name === p.name);
        if (existing) {
          pubIdMap[p.id] = existing.id;
        } else {
          state.data.publishers.push(p);
          pubIdMap[p.id] = p.id;
        }
      });

      const catIdMap = {};
      incoming.categories.forEach(c => {
        const existing = state.data.categories.find(x => x.kind === '个人' && x.name === c.name);
        if (existing) {
          catIdMap[c.id] = existing.id;
        } else {
          state.data.categories.push(c);
          catIdMap[c.id] = c.id;
        }
      });

      const evtIdMap = {};
      incoming.events.forEach(ev => {
        const mappedCatId = ev.kind === '团体' ? '' : (catIdMap[ev.categoryId] || ev.categoryId);
        const existing = state.data.events.find(x => x.kind === ev.kind && x.categoryId === mappedCatId && x.name === ev.name);
        if (existing) {
          evtIdMap[ev.id] = existing.id;
        } else {
          const newEv = { ...ev, categoryId: mappedCatId };
          state.data.events.push(newEv);
          evtIdMap[ev.id] = newEv.id;
        }
      });

      let addedCount = 0;
      const existingIds = new Set(state.data.editions.map(e => e.id));
      incoming.editions.forEach(ed => {
        if (existingIds.has(ed.id)) return;
        const mappedPubId = pubIdMap[ed.publisherId] || ed.publisherId;
        const mappedCatId = ed.kind === '团体' ? '' : (catIdMap[ed.categoryId] || ed.categoryId);
        const mappedEvtId = evtIdMap[ed.eventId] || ed.eventId;
        state.data.editions.push({
          ...ed,
          publisherId: mappedPubId,
          categoryId: mappedCatId,
          eventId: mappedEvtId
        });
        addedCount++;
      });
      return addedCount;
    }

      document.getElementById('edition-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const editId = document.getElementById('form-id').value;
        const publisherId = document.getElementById('form-publisher').value;
        const kind = document.getElementById('form-kind').value;

        let categoryId = '';
        if (kind === '个人') {
          const newCatName = document.getElementById('form-category-new').value.trim();
          const chosenCatName = (!document.getElementById('form-category-new').classList.contains('hidden') && newCatName)
            ? newCatName
            : document.getElementById('form-category-select').value;
          if (!chosenCatName) { showToast('请选择或新建活动类别'); return; }
          const existingCat = state.data.categories.find(c => c.kind === '个人' && c.name === chosenCatName);
          if (existingCat) {
            categoryId = existingCat.id;
          } else {
            categoryId = uid('cat');
            state.data.categories.push({ id: categoryId, kind: '个人', name: chosenCatName });
          }
        }

        const newEvtName = document.getElementById('form-event-new').value.trim();
        const chosenEvtName = (!document.getElementById('form-event-new').classList.contains('hidden') && newEvtName)
          ? newEvtName
          : document.getElementById('form-event-select').value;
        if (!chosenEvtName) { showToast('请选择或新建活动名称'); return; }

        let eventId = '';
        const existingEvt = kind === '团体'
          ? state.data.events.find(ev => ev.kind === '团体' && ev.name === chosenEvtName)
          : state.data.events.find(ev => ev.kind === '个人' && ev.categoryId === categoryId && ev.name === chosenEvtName);
        if (existingEvt) {
          eventId = existingEvt.id;
        } else {
          eventId = uid('evt');
          state.data.events.push({ id: eventId, kind, categoryId, name: chosenEvtName });
        }

        const imgUrl = state.uploadPreviewDataUrl || '';

        const payload = {
          publisherId,
          kind,
          categoryId,
          eventId,
          title: document.getElementById('form-title').value.trim(),
          deadline: document.getElementById('form-deadline').value,
          productType: '便利店打印',
          productCode: document.getElementById('form-code').value.trim(),
          sourceUrl: document.getElementById('form-source').value.trim(),
          notes: document.getElementById('form-notes').value.trim(),
          imageUrl: imgUrl
        };

        if (editId) {
          const idx = state.data.editions.findIndex(x => x.id === editId);
          if (idx !== -1) {
            const prev = state.data.editions[idx];
            state.data.editions[idx] = {
              ...prev,
              ...payload,
              inPrintList: prev.inPrintList
            };
          }
          showToast('已更新版面记录');
        } else {
          state.data.editions.unshift({
            id: uid('ed'),
            ...payload,
            inPrintList: false,
            printed: false,
            createdAt: Date.now()
          });
          showToast('已保存新版面');
        }
        saveData();
        document.getElementById('modal-form').classList.add('hidden');
        renderCurrentView();
      });

      // Category modal
      document.getElementById('cat-modal-cancel').addEventListener('click', () => document.getElementById('modal-cat').classList.add('hidden'));
      document.getElementById('cat-modal-confirm').addEventListener('click', () => {
        const val = document.getElementById('cat-modal-input').value.trim();
        if (!val) { showToast('名称不能为空'); return; }
        document.getElementById('modal-cat').classList.add('hidden');
        if (state.catAction) state.catAction(val);
      });

      // Confirm modal
      document.getElementById('confirm-cancel').addEventListener('click', () => document.getElementById('modal-confirm').classList.add('hidden'));
      document.getElementById('confirm-ok').addEventListener('click', () => {
        document.getElementById('modal-confirm').classList.add('hidden');
        if (state.confirmAction) state.confirmAction();
      });

      // Backup modal
      document.getElementById('btn-open-backup').addEventListener('click', () => {
        const cfg = loadGhConfig();
        document.getElementById('gh-repo').value = cfg.repo || detectGitHubRepoFromUrl() || '';
        document.getElementById('gh-branch').value = cfg.branch || 'main';
        document.getElementById('gh-token').value = cfg.token || '';
        document.getElementById('gh-auto-sync').checked = cfg.autoSync !== false;
        document.getElementById('modal-backup').classList.remove('hidden');
      });
      document.getElementById('btn-gh-pull').addEventListener('click', async () => {
        saveGhConfig({
          repo: document.getElementById('gh-repo').value.trim(),
          branch: document.getElementById('gh-branch').value.trim() || 'main',
          token: document.getElementById('gh-token').value.trim(),
          autoSync: document.getElementById('gh-auto-sync').checked
        });
        await pullFromGitHub(false);
      });
      document.getElementById('btn-gh-push').addEventListener('click', async () => {
        saveGhConfig({
          repo: document.getElementById('gh-repo').value.trim(),
          branch: document.getElementById('gh-branch').value.trim() || 'main',
          token: document.getElementById('gh-token').value.trim(),
          autoSync: document.getElementById('gh-auto-sync').checked
        });
        await pushToGitHub(false);
      });
      document.getElementById('backup-close').addEventListener('click', () => document.getElementById('modal-backup').classList.add('hidden'));
      document.getElementById('btn-export-json').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `RY表紙备份_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('已导出 JSON 备份');
      });
      document.getElementById('input-merge-json').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;
        let totalAdded = 0;
        let validFiles = 0;
        for (const file of files) {
          try {
            const text = await file.text();
            const parsed = JSON.parse(text);
            if (parsed && Array.isArray(parsed.publishers) && Array.isArray(parsed.editions)) {
              totalAdded += mergeImportedData(parsed);
              validFiles++;
            }
          } catch (err) {}
        }
        e.target.value = '';
        if (validFiles === 0) {
          showToast('JSON 文件格式不正确或解析失败');
          return;
        }
        saveData();
        document.getElementById('modal-backup').classList.add('hidden');
        renderCurrentView();
        showToast(`已导入 ${validFiles} 个 JSON 文件，新增 ${totalAdded} 张版面`);
      });
      document.getElementById('input-import-json').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed && Array.isArray(parsed.publishers) && Array.isArray(parsed.editions)) {
              state.data = normalizeData(parsed);
              saveData();
              document.getElementById('modal-backup').classList.add('hidden');
              renderCurrentView();
              showToast('备份数据恢复成功');
            } else {
              showToast('备份文件格式不正确');
            }
          } catch (err) {
            showToast('解析备份文件失败');
          }
        };
        reader.readAsText(file);
      });
      document.getElementById('btn-reset-demo').addEventListener('click', () => {
        openConfirmModal('恢复示例数据', '这将覆盖当前的本地修改，恢复为初始示例数据，确定继续吗？', () => {
          state.data = createDefaultData();
          saveData();
          document.getElementById('modal-backup').classList.add('hidden');
          state.browse = { publisherId: null, kind: null, categoryId: null, eventId: null };
          switchView('home');
          showToast('已恢复默认示例数据');
        });
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      bindEvents();
      state.data = await loadData();
      switchView('home');
      const cfg = loadGhConfig();
      if (cfg.repo || detectGitHubRepoFromUrl()) {
        pullFromGitHub(true);
      }
    });
  </script>
</body>
</html>
